<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Magpies Scoring & Timing">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<title>Magpies Scoring & Timing</title>

<style>
@font-face {
  font-family: 'Orbitron';
  src: url('./fonts/Orbitron-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
}

@font-face {
  font-family: 'Roboto';
  src: url('./fonts/Roboto-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
}

body {
  margin: 0;
  background: black;
  font-family: Arial, sans-serif;
  -webkit-user-select: none;   /* iOS Safari */
  -ms-user-select: none;       /* old Edge */
  user-select: none;           /* modern browsers */
  -webkit-touch-callout: none; /* disables long-press menu on iOS */
}

.container {
  width: 90vw;
  height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

.row {
  height: 8vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* COLOURS */
.header { background: #555555; color: white; }
.Magpies { background: #000000; color: white; }
.opposition { background: white; color: black; }
.time-section { background: #555555; color: white; }

/* TEXT */
.title { font-size: 5vh; font-family: 'Orbitron'; }
.subtitle { font-size: 3.5vh; font-family: 'Orbitron'; }

/* SCORES */
.score-values {
  display: flex;
  width: 100%;
  justify-content: space-around;
}

.score-box {
  width: 40%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.label { font-size: 1.6vh; }
.value { font-size: 5.5vh; }

/* BUTTONS */
.button-row {
  display: flex;
  width: 100%;
  justify-content: space-around;
}

.button-group {
  width: 40%;
  display: flex;
}

button {
  flex: 1;
  border: none;
  border-radius: 0.8vh;
  min-height: 6vh;
  touch-action: manipulation;
}

button {
  font-size: 3vh;
  font-weight: bold;
}

button svg {
  width: 60%;
  height: 60%;
  fill: currentColor;
  display: block;
  margin: auto;
}

/* SVG ICONS */
button svg {
  width: 60%;
  height: 60%;
  fill: currentColor;
  display: block;
  margin: auto;
}

/* TIME BUTTONS */
.time-buttons {
  width: 100%;
  display: flex;
  height: 100%;
}

.time-buttons button {
  height: 70%;
}

/* COLOURS */
.plus { background: #C2FFA3; }
.minus { background: #FF9999; }
.play { background: #C2FFA3; }
.pause { background: #FFE599; }
.reset { background: #FF9999; }

/* DISABLED */
button:disabled {
  background: #cccccc !important;
  color: #666;
  cursor: not-allowed;
}

/* PRESS */
button:active:not(:disabled) {
  transform: scale(0.9);
  filter: brightness(0.9);
}

/* TOTAL */
.total-box {
  display: flex;
  align-items: center;
  justify-content: center;
}

.total-value {
  font-size: 7vh;
  font-weight: bold;
  font-family: 'Roboto', sans-serif;
  letter-spacing: 0.08em;
  text-shadow: 0 0 10px rgba(255, 120, 120, 0.6);
  transition: transform 0.2s;
}

/* PULSE */
.pulse {
  animation: pulseAnim 0.4s ease;
}

@keyframes pulseAnim {
  0%   { transform: scale(1); text-shadow: 0 0 10px rgba(255,255,255,0.6); }
  50%  { transform: scale(1.25); text-shadow: 0 0 25px rgba(255,255,255,1); }
  100% { transform: scale(1); text-shadow: 0 0 10px rgba(255,255,255,0.6); }
}

/* TIME */
.time-row {
  width: 100%;
  display: flex;
}

.quarter-box {
  width: 40%;
  font-size: 3.8vh;
  font-family: 'Orbitron';
  display: flex;
  align-items: center;
  justify-content: center;
}

.clock-box {
  width: 60%;
  font-size: 6.5vh;
  font-family: 'Orbitron';
  display: flex;
  align-items: center;
  justify-content: center;
}

.magpies-logo-fixed {
  position: fixed;
  left: 50%;
  top: 15vh;              /* aligns under Magpies row */
  transform: translateX(-50%);

  width: 10vh;
  opacity: 0.25;

  z-index: 0;
  pointer-events: none;
}

.footer { height: 3vh; background: black; color: grey; }

</style>
</head>

<body>

<div class="container">

<div class="row header title">Footy Scores</div>

<div class="row Magpies subtitle">Magpies</div>

<img src="Pies.png" class="magpies-logo-fixed">

<div class="row Magpies score-values">
  <div class="score-box">
    <div class="label">Goals</div>
    <div id="g1" class="value">0</div>
  </div>
  <div class="score-box">
    <div class="label">Behinds</div>
    <div id="b1" class="value">0</div>
  </div>
</div>

<div class="row Magpies button-row">
  <div class="button-group">
    <button class="minus"
      onpointerdown="startHold('g1',-1)"
      onpointerup="stopHold('g1',-1)"
      onpointercancel="stopHold()"
      onpointerleave="stopHold()">
      -
    </button>

    <button class="plus"
      onpointerdown="startHold('g1',1)"
      onpointerup="stopHold('g1',1)"
      onpointercancel="stopHold()"
      onpointerleave="stopHold()">
      +
    </button>
  </div>

  <div class="button-group">
    <button class="minus"
      onpointerdown="startHold('b1',-1)"
      onpointerup="stopHold('b1',-1)"
      onpointercancel="stopHold()"
      onpointerleave="stopHold()">
      -
    </button>

    <button class="plus"
      onpointerdown="startHold('b1',1)"
      onpointerup="stopHold('b1',1)"
      onpointercancel="stopHold()"
      onpointerleave="stopHold()">
      +
    </button>
  </div>
</div>

<div class="row Magpies">
  <div class="total-box">
    <div id="t1" class="total-value">0</div>
  </div>
</div>

<div class="row opposition subtitle">Opposition</div>

<div class="row opposition score-values">
  <div class="score-box">
    <div class="label">Goals</div>
    <div id="g2" class="value">0</div>
  </div>
  <div class="score-box">
    <div class="label">Behinds</div>
    <div id="b2" class="value">0</div>
  </div>
</div>

<div class="row opposition button-row">
  <div class="button-group">
    <button class="minus"
      onpointerdown="startHold('g2',-1)"
      onpointerup="stopHold('g2',-1)"
      onpointercancel="stopHold()"
      onpointerleave="stopHold()">
      -
    </button>

    <button class="plus"
      onpointerdown="startHold('g2',1)"
      onpointerup="stopHold('g2',1)"
      onpointercancel="stopHold()"
      onpointerleave="stopHold()">
      +
    </button>
  </div>

  <div class="button-group">
    <button class="minus"
      onpointerdown="startHold('b2',-1)"
      onpointerup="stopHold('b2',-1)"
      onpointercancel="stopHold()"
      onpointerleave="stopHold()">
      -
    </button>

    <button class="plus"
      onpointerdown="startHold('b2',1)"
      onpointerup="stopHold('b2',1)"
      onpointercancel="stopHold()"
      onpointerleave="stopHold()">
      +
    </button>
  </div>
</div>

<div class="row opposition">
  <div class="total-box">
    <div id="t2" class="total-value">0</div>
  </div>
</div>

<div class="row time-section subtitle">Timing</div>

<div class="row time-section">
  <div class="time-row">
    <div id="quarter" class="quarter-box">Q1</div>
    <div id="clock" class="clock-box">0:00</div>
  </div>
</div>

<div class="row time-section">
  <div class="time-buttons">
    <button id="qMinus" class="minus" onclick="changeQuarter(-1)">-</button>
    <button id="qPlus" class="plus" onclick="changeQuarter(1)">+</button>

    <button class="pause" onclick="pauseTimer()">
      <svg viewBox="0 0 24 24">
        <rect x="6" y="5" width="4" height="14"/>
        <rect x="14" y="5" width="4" height="14"/>
      </svg>
    </button>

    <button class="play" onclick="startTimer()">
      <svg viewBox="0 0 24 24">
        <polygon points="8,5 19,12 8,19"/>
      </svg>
    </button>

    <button class="reset" onclick="resetTimer()">
      <svg viewBox="0 0 24 24">
        <rect x="6" y="6" width="12" height="12"/>
      </svg>
    </button>
  </div>
</div>

<div class="row footer">
  <div>
    <a href="mailto:acamapps@outlook.com">email</a> | acamapps v1.00
  </div>
</div>

</div>

<script>

document.addEventListener("pointerup", stopHold);
document.addEventListener("touchend", stopHold);

let scores = { g1:0, b1:0, g2:0, b2:0 };

function triggerPulse(id) {
  const el = document.getElementById(id);
  el.classList.remove("pulse");
  void el.offsetWidth;
  el.classList.add("pulse");
}

const locks = {};

function safeTap(id, action, delay = 200) {
  if (locks[id]) return;

  locks[id] = true;
  action();

  setTimeout(() => {
    locks[id] = false;
  }, delay);
}

function vibrate() {
  if (navigator.vibrate) navigator.vibrate(10);
}

function updateScore(id, delta) {
  scores[id] = Math.max(0, scores[id] + delta);
  document.getElementById(id).textContent = scores[id];

  document.getElementById("t1").textContent = scores.g1*6 + scores.b1;
  document.getElementById("t2").textContent = scores.g2*6 + scores.b2;

  vibrate();

  if (id === "g1" || id === "b1") {
    triggerPulse("t1");
  } else if (id === "g2" || id === "b2") {
    triggerPulse("t2");
  }

}

let holdTimeout;
let holdInterval;
let holding = false;

function startHold(id, delta) {
  stopHold();
  holding = false;

  holdTimeout = setTimeout(() => {
    holding = true;

    holdInterval = setInterval(() => {
      updateScore(id, delta);
    }, 200); // faster repeat but controlled
  }, 350); // <-- MUCH better delay
}

function stopHold(id, delta) {
  clearTimeout(holdTimeout);
  clearInterval(holdInterval);

  if (!holding && id !== undefined && scores.hasOwnProperty(id)) {
    safeTap(id, () => updateScore(id, delta));
  }
}

let startTime = null;
let pausedAt = null;
let pausedTotal = 0;
let running = false;

function formatTime(t){
  let m = Math.floor(t/60);
  let s = t%60;
  return m + ":" + (s<10?"0":"") + s;
}

function updateClock() {
  if (!startTime) {
    document.getElementById("clock").textContent = "0:00";
    return;
  }

  let end = running ? Date.now() : (pausedAt || Date.now());

  let elapsed = end - startTime - pausedTotal;
  let seconds = Math.floor(elapsed / 1000);

  let m = Math.floor(seconds / 60);
  let s = seconds % 60;

  document.getElementById("clock").textContent =
    m + ":" + (s < 10 ? "0" : "") + s;
}

function startTimer() {
  if (running) return;

  const now = Date.now();

  if (!startTime) {
    startTime = now;
  } else if (pausedAt) {
    pausedTotal += now - pausedAt;
    pausedAt = null;
  }

  running = true;
  saveTimer();
}

function pauseTimer() {
  if (!running) return;

  pausedAt = Date.now();
  running = false;
  saveTimer();
}

function resetTimer() {
  startTime = null;
  pausedAt = null;
  pausedTotal = 0;
  running = false;

  document.getElementById("clock").textContent = "0:00";

  saveTimer();
}

let q = 1;

function changeQuarter(d){
  q = Math.max(1, Math.min(4, q + d));
  document.getElementById("quarter").textContent = "Q" + q;
  updateQuarterButtons();
}

function updateQuarterButtons(){
  document.getElementById("qMinus").disabled = (q === 1);
  document.getElementById("qPlus").disabled = (q === 4);
}

function saveTimer() {
  localStorage.setItem("timer", JSON.stringify({
    startTime,
    pausedAt,
    pausedTotal,
    running
  }));
}

function loadTimer() {
  let data = localStorage.getItem("timer");
  if (!data) return;

  let t = JSON.parse(data);

  startTime = t.startTime;
  pausedAt = t.pausedAt;
  pausedTotal = t.pausedTotal;
  running = false; // always resume in paused state safely
}

updateClock();
updateQuarterButtons();

loadTimer();
updateClock();
setInterval(updateClock, 250);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js');
}
  
</script>

</body>
</html>
